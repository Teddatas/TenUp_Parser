<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tournois de tennis — carte par temps de trajet</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root { --bg:#fff; --fg:#1a1a2e; --muted:#667; --line:#e3e3ec; --accent:#1a73e8; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; color:var(--fg); }
  #app { display:flex; height:100%; }
  #panel { width:300px; flex:none; background:var(--bg); border-right:1px solid var(--line);
           padding:16px; overflow-y:auto; }
  #map { flex:1; }
  h1 { font-size:15px; margin:0 0 2px; }
  .sub { color:var(--muted); font-size:12px; margin-bottom:14px; }
  .field { margin-bottom:14px; }
  .field > label { display:block; font-weight:600; font-size:12px; margin-bottom:5px;
                   text-transform:uppercase; letter-spacing:.03em; color:var(--muted); }
  .seg { display:flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .seg button { flex:1; border:0; background:var(--bg); padding:7px 4px; font:inherit; cursor:pointer; color:var(--muted); }
  .seg button.on { background:var(--accent); color:#fff; font-weight:600; }
  select, input[type=text] { width:100%; padding:7px 8px; border:1px solid var(--line); border-radius:8px; font:inherit; background:var(--bg); }
  input[type=range] { width:100%; }
  .daterow { display:flex; align-items:center; gap:6px; }
  .daterow input[type=date] { flex:1; min-width:0; padding:6px 6px; border:1px solid var(--line);
                              border-radius:8px; font:inherit; background:var(--bg); color:var(--fg); }
  .daterow span { color:var(--muted); }
  .rowval { display:flex; justify-content:space-between; font-size:12px; color:var(--muted); }
  #count { font-weight:700; font-size:20px; }
  .legend { display:flex; flex-direction:column; gap:3px; margin-top:6px; font-size:12px; }
  .legend span { display:inline-block; width:14px; height:14px; border-radius:3px; margin-right:6px; vertical-align:-2px; }
  .apply { width:100%; padding:8px; border:0; border-radius:8px; background:var(--accent); color:#fff; font:inherit; font-weight:600; cursor:pointer; }
  .hint { font-size:11px; color:var(--muted); margin-top:5px; }
  .leaflet-popup-content { font:13px/1.45 system-ui,sans-serif; }
  .cta { display:block; margin-top:10px; padding:7px 10px; background:var(--accent); color:#fff !important;
         text-align:center; border-radius:6px; text-decoration:none; font-weight:600; }
  @media (max-width:720px){ #app{flex-direction:column;} #panel{width:100%;height:auto;max-height:46vh;} }
</style>
</head>
<body>
<div id="app">
  <div id="panel">
    <h1>Tournois de tennis</h1>
    <div class="sub" id="meta"></div>

    <div class="field">
      <label>Je suis</label>
      <div class="seg" data-seg="sexe">
        <button data-v="H" class="on">Homme</button>
        <button data-v="F">Femme</button>
      </div>
    </div>

    <div class="field">
      <label>Format</label>
      <div class="seg" data-seg="format">
        <button data-v="S" class="on">Simple</button>
        <button data-v="D">Double</button>
        <button data-v="*">Les deux</button>
      </div>
    </div>

    <div class="field">
      <label>Type</label>
      <div class="seg" data-seg="type">
        <button data-v="*" class="on">Tous</button>
        <button data-v="standard">Tournoi</button>
        <button data-v="mc">TMC</button>
      </div>
    </div>

    <div class="field">
      <label>Catégorie d'âge</label>
      <select id="cat"></select>
    </div>

    <div class="field">
      <label>Mon classement</label>
      <select id="classement"></select>
    </div>

    <div class="field">
      <label>Trajet</label>
      <div class="seg tn-multi" data-multi="modes">
        <button data-v="velo" class="on">Vélo</button>
        <button data-v="transit" class="on">Transports</button>
        <button data-v="car" class="on">Voiture</button>
      </div>
    </div>

    <div class="field">
      <label>Temps de trajet max</label>
      <input type="range" id="tmax" min="15" max="150" step="5" value="150">
      <div class="rowval"><span>15 min</span><span id="tmaxval">illimité</span></div>
    </div>

    <div class="field">
      <label>Début du tournoi</label>
      <div class="daterow">
        <input type="date" id="dfrom">
        <span>→</span>
        <input type="date" id="dto">
      </div>
    </div>

    <div class="field">
      <div id="count">–</div>
      <div class="sub">tournois affichés</div>
      <div class="legend" id="legend"></div>
    </div>

    <div class="field" id="origine-field" hidden>
      <label>Point de départ</label>
      <select id="origine"></select>
    </div>
  </div>
  <div id="map"></div>
</div>

<script id="data" type="application/json">/*__DATA__*/</script>
<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const ORIGINS = DATA.origines || [];
const P = DATA.parametres || {};
document.getElementById('meta').textContent =
  `${ORIGINS[0] ? ORIGINS[0].label : ''} · rayon ${P.rayon_km} km · ${DATA.genere_le.slice(0,16).replace('T',' ')}`;

const BUCKETS = [15, 30, 45, 60];
const COLORS = ['#1a9850', '#91cf60', '#fee08b', '#fc8d59', '#d73027'];
const UNKNOWN = '#5a6b8c';
const colorFor = m => {
  if (m == null) return UNKNOWN;
  for (let i = 0; i < BUCKETS.length; i++) if (m <= BUCKETS[i]) return COLORS[i];
  return COLORS[COLORS.length - 1];
};
const fmt = m => m == null ? '?' : (m < 60 ? m + ' min' : Math.floor(m/60) + 'h' + String(m%60).padStart(2,'0'));

// ---- Contrôles ----
const ALL_MODES = ['velo', 'transit', 'car'];
const _todayISO = new Date().toISOString().slice(0, 10);
const _maxISO = (DATA.tournois || []).reduce((a, t) => t.date_debut > a ? t.date_debut : a, _todayISO);
const state = { sexe:'H', format:'S', type:'*', modes:[...ALL_MODES], cat:'*', echelon:120, tmax:150,
                dfrom:_todayISO, dto:_maxISO,
                origin: (ORIGINS[0] && ORIGINS[0].id) || 'default' };
const originById = id => ORIGINS.find(o => o.id === id) || ORIGINS[0] || {lat:48.86,lng:2.35};

document.querySelectorAll('.seg[data-seg]').forEach(seg => {
  const key = seg.dataset.seg;
  seg.querySelectorAll('button').forEach(b => b.onclick = () => {
    seg.querySelectorAll('button').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    state[key] = b.dataset.v;
    render();
  });
});
document.querySelectorAll('.tn-multi').forEach(seg => {
  seg.querySelectorAll('button').forEach(b => b.onclick = () => {
    const set = new Set(state.modes);
    set.has(b.dataset.v) ? set.delete(b.dataset.v) : set.add(b.dataset.v);
    if (set.size) {
      state.modes = [...set];
      seg.querySelectorAll('button').forEach(x =>
        x.classList.toggle('on', state.modes.includes(x.dataset.v)));
      render();
    }
  });
});

const catSel = document.getElementById('cat');
catSel.innerHTML = '<option value="*">Toutes</option>' +
  DATA.referentiel.categories_age.map(c => `<option value="${c.libelle}">${c.libelle}</option>`).join('');
catSel.value = 'Senior';
state.cat = 'Senior';
catSel.onchange = () => { state.cat = catSel.value; render(); };

const clSel = document.getElementById('classement');
clSel.innerHTML = DATA.referentiel.classements
  .slice().reverse()
  .map(c => `<option value="${c.echelon}">${c.label}</option>`).join('');
clSel.value = '120';
clSel.onchange = () => { state.echelon = +clSel.value; render(); };

const tmax = document.getElementById('tmax'), tmaxval = document.getElementById('tmaxval');
tmax.oninput = () => {
  state.tmax = +tmax.value;
  tmaxval.textContent = state.tmax >= 150 ? 'illimité' : state.tmax + ' min';
  render();
};
const dfromEl = document.getElementById('dfrom'), dtoEl = document.getElementById('dto');
[dfromEl, dtoEl].forEach(el => { el.min = _todayISO; el.max = _maxISO; });
dfromEl.value = state.dfrom; dtoEl.value = state.dto;
dfromEl.onchange = () => {
  state.dfrom = dfromEl.value || _todayISO;
  if (state.dto < state.dfrom) { state.dto = state.dfrom; dtoEl.value = state.dto; }
  render();
};
dtoEl.onchange = () => {
  state.dto = dtoEl.value || _maxISO;
  if (state.dfrom > state.dto) { state.dfrom = state.dto; dfromEl.value = state.dfrom; }
  render();
};

const origSel = document.getElementById('origine');
if (ORIGINS.length > 1) {
  document.getElementById('origine-field').hidden = false;
  origSel.innerHTML = ORIGINS.map(o => `<option value="${o.id}">${o.label}</option>`).join('');
  origSel.value = state.origin;
  origSel.onchange = () => { state.origin = origSel.value; moveHome(); render(); };
}

// ---- Carte ----
const start = originById(state.origin);
const map = L.map('map').setView([start.lat, start.lng], 12);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19, attribution: '&copy; OpenStreetMap'
}).addTo(map);
let homeMarker = L.marker([start.lat, start.lng], { title: 'Départ' }).addTo(map).bindTooltip('Départ');
function moveHome() {
  const o = originById(state.origin);
  homeMarker.setLatLng([o.lat, o.lng]);
  map.panTo([o.lat, o.lng]);
}
let markerLayer = L.layerGroup().addTo(map);

document.getElementById('legend').innerHTML = (() => {
  let prev = 0, rows = [];
  BUCKETS.forEach((e, i) => { rows.push(`<div><span style="background:${COLORS[i]}"></span>${prev}–${e} min</div>`); prev = e; });
  rows.push(`<div><span style="background:${COLORS[4]}"></span>&gt; ${prev} min</div>`);
  rows.push(`<div><span style="background:${UNKNOWN}"></span>inconnu</div>`);
  return rows.join('');
})();

const timesFor = t => (t.temps && t.temps[state.origin]) || {};
const _hav = (a,b,c,d) => { const p=Math.PI/180, x=0.5-Math.cos((c-a)*p)/2+Math.cos(a*p)*Math.cos(c*p)*(1-Math.cos((d-b)*p))/2; return 12742*Math.asin(Math.sqrt(x)); };
const kmFromOrigin = club => { const o = originById(state.origin); return _hav(o.lat, o.lng, club.lat, club.lng); };
const minutesForMode = t => {
  const tt = timesFor(t);
  const v = state.modes.map(m => tt[m]).filter(x => x != null);
  return v.length ? Math.min(...v) : null;
};

function matchingEpreuves(t) {
  return t.epreuves.filter(e => {
    if (e.sexe !== state.sexe && e.sexe !== 'mixte') return false;
    if (state.format === 'S' && e.double) return false;
    if (state.format === 'D' && !e.double) return false;
    if (state.type !== '*' && (e.format || 'standard') !== state.type) return false;
    if (state.cat !== '*' && e.categorie_age !== state.cat) return false;
    if (e.echelon_min != null && state.echelon < e.echelon_min) return false;
    if (e.echelon_max != null && state.echelon > e.echelon_max) return false;
    return true;
  });
}

const dfr = s => s.slice(8,10)+'/'+s.slice(5,7)+'/'+s.slice(0,4);

function tournoiBlock(t, eps) {
  const lis = eps.map(e => {
    const tarif = e.tarif_adulte ? ` · ${Math.round(e.tarif_adulte)}€` : '';
    const rng = (e.classement_min || e.classement_max) ? ` (${e.classement_min}→${e.classement_max})` : '';
    const clot = e.date_cloture ? ` · clôture ${e.date_cloture.slice(8,10)}/${e.date_cloture.slice(5,7)}` : '';
    const mc = (e.format === 'mc') ? ' · TMC' : '';
    return `<li>${e.libelle}${rng}${tarif}${clot}${mc}</li>`;
  }).join('');
  const meta = [t.surfaces && 'Surface : ' + t.surfaces, t.prix_espece && 'Prix : ' + Math.round(t.prix_espece) + '€']
    .filter(Boolean).join(' · ');
  return `<div style="margin-top:8px;padding-top:8px;border-top:1px solid #e5e2dc">
    <b>${t.libelle}</b>
    <div>📅 ${dfr(t.date_debut)} → ${dfr(t.date_fin)}</div>
    <ul style="margin:4px 0 0 -22px">${lis}</ul>
    ${meta ? `<div style="color:#667;font-size:11px">${meta}</div>` : ''}
    <a class="cta" href="${t.url}" target="_blank" rel="noopener">${t.inscription_en_ligne ? "S'inscrire sur Ten'Up →" : "Voir la fiche Ten'Up →"}</a>
  </div>`;
}

function clubPopupHtml(club, items, t0) {
  const tt = timesFor(t0);
  return `<div style="min-width:235px">
    <div style="color:#667">${club.libelle} — ${club.ville}</div>
    <div style="margin-top:4px">🚲 <b>${fmt(tt.velo)}</b> | 🚇 <b>${fmt(tt.transit)}</b> | 🚗 <b>${fmt(tt.car)}</b> | ${kmFromOrigin(club).toFixed(1)} km</div>
    ${items.length > 1 ? `<div style="font-size:11px;color:#888">${items.length} tournois dans ce club</div>` : ''}
    ${items.map(it => tournoiBlock(it.t, it.eps)).join('')}
  </div>`;
}

const SEARCH_RADIUS = ((DATA.parametres && DATA.parametres.rayon_km) || 30) + 3;

function render() {
  markerLayer.clearLayers();
  const byClub = new Map();
  for (const t of DATA.tournois) {
    if (t.date_debut < state.dfrom || t.date_debut > state.dto) continue;
    if (kmFromOrigin(t.club) > SEARCH_RADIUS) continue;  // proche de l'origine active
    const eps = matchingEpreuves(t);
    if (!eps.length) continue;
    const m = minutesForMode(t);
    if (state.tmax < 150 && (m == null || m > state.tmax)) continue;
    const key = t.club.code || `${t.club.lat},${t.club.lng}`;
    if (!byClub.has(key)) byClub.set(key, { club: t.club, m, t0: t, items: [] });
    byClub.get(key).items.push({ t, eps });
  }
  let n = 0;
  for (const g of byClub.values()) {
    g.items.sort((a, b) => a.t.date_debut < b.t.date_debut ? -1 : 1);
    n += g.items.length;
    L.circleMarker([g.club.lat, g.club.lng], {
      radius: g.items.length > 1 ? 10 : 8, color: '#fff', weight: 2, fillColor: colorFor(g.m), fillOpacity: 1
    }).bindPopup(clubPopupHtml(g.club, g.items, g.t0), { maxHeight: 340 })
      .bindTooltip(g.items.length > 1
        ? `${g.club.libelle} — ${g.items.length} tournois · ${fmt(g.m)}`
        : `${g.items[0].t.libelle} — ${fmt(g.m)}`)
      .addTo(markerLayer);
  }
  document.getElementById('count').textContent = n;
}
render();
</script>
</body>
</html>
